    <!-- Meta Pixel noscript fallback — moved from <head>: a <noscript> with
         non-phrasing content (this <img>) isn't valid there, and Vite's
         spec-compliant HTML parser (parse5) rejects it at build time. CRA's
         webpack HTML handling never validated this. -->
    <noscript
      ><img
        height="1"
        width="1"
        style="display:none"
        src="https://www.facebook.com/tr?id=2146744462391711&ev=PageView&noscript=1"

    <!-- Google Tag Manager (noscript) -->
    <noscript>

        src="https://www.googletagmanager.com/ns.html?id=GTM-PBR4KTF"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
        title="Google Tag Manager"

    </noscript>

    <!-- ===== CONDITIONAL FEATURES ===== -->
    <script>
      var isNoIndexing = "false";
      if (isNoIndexing === "true") {
        var keyNames = ["robots", "googlebot"];
        keyNames.forEach(function (item) {
          var link = document.createElement("meta");
          link.setAttribute("name", item);
          link.content = "noindex";
          document.getElementsByTagName("head")[0].appendChild(link);
        });
      }
    </script>

    <!-- Accessibility widget — deferred until after window.load so its
         pre-React "Ctrl+F2" hint box doesn't flash during initial paint.
         Mirrors the __UX4G_ENABLED gate in <head>.

         CAVEAT that this deferral has to work around: the UX4G widget
         (v2.22.0) wires up ALL of its controls inside unconditional
         document.addEventListener("DOMContentLoaded", …) handlers, and
         clears its loading state on window "load" — with no
         readyState guard. Because we inject it *after* those events have
         already fired, those handlers would never run: the widget's HTML
         paints (buttons visible) but every click is dead and it stays
         stuck in its loading class. So we replay those two lifecycle
         events, but ONLY for the widget's own listeners — captured via a
         temporary addEventListener shim installed just around the
         widget's execution — so no app/analytics listeners are retriggered. -->
    <script>
      if (window.__UX4G_ENABLED) {
        var injectAccessibilityWidget = function () {
          var REPLAY = { DOMContentLoaded: 1, load: 1 };
          var captured = [];

          var origDocAdd = document.addEventListener;
          var origWinAdd = window.addEventListener;
          document.addEventListener = function (type, listener, opts) {
            if (REPLAY[type] && typeof listener === "function") {
              captured.push({ target: document, type: type, fn: listener });
            }
            return origDocAdd.call(document, type, listener, opts);
          };
          window.addEventListener = function (type, listener, opts) {
            if (REPLAY[type] && typeof listener === "function") {
              captured.push({ target: window, type: type, fn: listener });
            }
            return origWinAdd.call(window, type, listener, opts);
          };

          var restore = function () {
            document.addEventListener = origDocAdd;
            window.addEventListener = origWinAdd;
          };

          var script = document.createElement("script");
          script.src = "https://cdn.ux4g.gov.in/tools/accessibility-widget.js";
          script.onload = function () {
            restore();
            // Fire the widget's captured DOMContentLoaded/load handlers so
            // it binds its controls and drops its loading state.
            for (var i = 0; i < captured.length; i++) {
              try {
                captured[i].fn.call(
                  captured[i].target,
                  new Event(captured[i].type)
                );
              } catch (_) {}
            }
          };
          script.onerror = restore;
          document.head.appendChild(script);
        };
        if (document.readyState === "complete") {
          injectAccessibilityWidget();
        } else {
          window.addEventListener("load", injectAccessibilityWidget);
        }
      }
    </script>

    <!-- ===== CONFIG API PREFETCH — runs in parallel with bundle download ===== -->
    <script>
      window.__CONFIG_PROMISE__ = fetch("https://gateway.bengaluruairport.com/cms/api/config")
        .then(function (r) {
          return r.ok ? r.json() : null;
        })
        .catch(function () {
          return null;
        });
    </script>

    <!-- ===== UX4G SPILLAGE NUKE — mounts whenever the widget is enabled for the
         ENVIRONMENT, at any viewport width (see __UX4G_SPILL_GUARD in <head>).
         It used to be gated on __UX4G_ENABLED, which also requires >=1024px, so
         below that width the spill was never scrubbed — the snippet was showing
         as raw text on mobile.
         This MutationObserver watches every DOM mutation under <body>, which
         during React hydration is thousands of nodes — expensive on the
         main thread. Where the widget is disabled entirely, there's nothing to
         scrub, hence still a gate rather than always-on. ===== -->
    <script>
      if (window.__UX4G_SPILL_GUARD) {
        (function () {
          var SIGS = [
            "const bodyElement = document.body",
            "accessibility-beta-v1.15/accessibility-widget.js",
            "existingScripts",
          ];

          function isSpill(text) {
            return SIGS.some(function (s) {
              return text.indexOf(s) !== -1;
            });
          }

          function nuke(node) {
            try {
              node.parentNode && node.parentNode.removeChild(node);
            } catch (_) {}
          }

          function sweepWithin(root) {
            if (!root) return;
            var walker = document.createTreeWalker(
              root,
              NodeFilter.SHOW_TEXT,
              null
            );
            /* Collect first, remove after: removing a node mid-traversal can
               make the TreeWalker skip its siblings, so an in-loop nuke could leave
               part of a spill behind. */
            var doomed = [];
            var n;
            while ((n = walker.nextNode())) {
              if (isSpill(n.textContent)) doomed.push(n);
            }
            for (var d = 0; d < doomed.length; d++) nuke(doomed[d]);
          }

          function sweep() {
            sweepWithin(document.body);
          }

          var mo = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var added = mutations[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                var node = added[j];
                if (node.nodeType === 3 && isSpill(node.textContent)) {
                  nuke(node);
                  continue;
                }
                if (node.nodeType === 1) {
                  var txt = node.textContent || "";
                  /* Bounded length check first — textContent on a large subtree is
                     costly, and the snippet is only ~600 chars. */
                  if (txt.length < 4000 && isSpill(txt)) {
                    if (node.querySelector("*:not(br)")) {
                      /* Spill sits deeper inside this subtree. The previous code
                         required a LEAF element (!querySelector), so a spill
                         wrapped in anything with children survived — that is the
                         case that was leaking through. Scrub the text nodes in
                         place instead of removing the whole subtree, which could
                         take real content with it. */
                      sweepWithin(node);
                    } else {
                      nuke(node);
                    }
                  }
                }
              }
            }
          });

          mo.observe(document.body, { childList: true, subtree: true });

          sweep();
          setTimeout(sweep, 0);
          setTimeout(sweep, 200);
          setTimeout(sweep, 1000);
        })();
      }
    </script>

    <div id="root">

        <div class="il-spinner"></div>
