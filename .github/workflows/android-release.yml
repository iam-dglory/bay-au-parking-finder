# Builds a signed Android App Bundle when a version tag (v1.2.1, ...) is pushed.
# Download the AAB and mapping.txt from the run's artifacts and upload both to Play Console.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            public
            scripts
            android
            marketing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run validate:play-assets
      - run: npm run validate:parking-data
      - run: npm run cap:android
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ezwiagssiuvmhayvsmbk.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_5Swgqoy2CDhhz1URX9zzPA_Xv1m_Wah' }}
          VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY || 'AIzaSyDzf73MtrZlVoeFtGCGWry0eGvzxMyWcWM' }}
          VITE_GOOGLE_MAP_ID: ${{ vars.VITE_GOOGLE_MAP_ID }}
      - name: Restore upload keystore
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Android signing secrets are missing. Configure all four ANDROID_* repository secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/upload.p12
          if ! keytool -list -keystore app/upload.p12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The Android upload keystore secret is invalid, corrupt, or does not match its password and alias."
            exit 1
          fi
          cat > keystore.properties <<PROPS
          storeFile=upload.p12
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - name: Build signed bundle
        working-directory: android
        # gradle.properties pins a JDK path from a developer's Mac; use the runner's JDK.
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bay-android-${{ github.ref_name }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
            marketing/play-store/listing-copy.md
            marketing/play-store/release-notes.txt
            marketing/play-store/screenshots/*.png
      - name: Remove keystore
        if: always()
        run: rm -f android/app/upload.p12 android/keystore.properties
