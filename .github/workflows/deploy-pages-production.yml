name: Deploy GitHub Pages production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed source commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bay-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_BASE_PATH: /bay-au-parking-finder/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
