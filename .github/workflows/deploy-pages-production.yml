name: CD (deploy to GitHub Pages)

# Continuous deployment: runs automatically after CI passes on main.
# Can still be run by hand with a reviewed commit SHA (e.g. to roll back).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed source commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bay-pages-production
  cancel-in-progress: false

jobs:
  build:
    # Only deploy main after a successful CI run on a push (not on PR runs).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # Build-time settings. Actions variables override these defaults.
      # The publishable key is meant to ship in the browser bundle (access is
      # enforced by row level security), so it is safe to keep here.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ezwiagssiuvmhayvsmbk.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_5Swgqoy2CDhhz1URX9zzPA_Xv1m_Wah' }}
      # Browser Maps key (it ships in the site's JavaScript anyway). Locked in
      # Google Cloud to iam-dglory.github.io, the Android app and localhost,
      # and to the Maps JavaScript API only. An Actions variable overrides it.
      VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY || 'AIzaSyDzf73MtrZlVoeFtGCGWry0eGvzxMyWcWM' }}
      VITE_GOOGLE_MAP_ID: ${{ vars.VITE_GOOGLE_MAP_ID }}
    steps:
      - name: Check build settings
        run: |
          missing=""
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Actions variables:$missing. Without them the app cannot reach Supabase and fails on load."
            exit 1
          fi
          [ -n "$VITE_GOOGLE_MAPS_API_KEY" ] || echo "::warning::VITE_GOOGLE_MAPS_API_KEY is not set; the site will deploy without the map (prices list still works)."
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_BASE_PATH: /bay-au-parking-finder/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
