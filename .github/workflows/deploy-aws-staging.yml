name: Deploy AWS staging
on:
  workflow_dispatch:
  push:
    branches: [infra/aws-migration-20261019]
    paths:
      - src/**
      - public/**
      - package*.json
      - vite.config.ts
      - .github/workflows/deploy-aws-staging.yml
permissions:
  id-token: write
  contents: read
concurrency:
  group: bay-aws-staging
  cancel-in-progress: false
jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm test
      - run: VITE_SKIP_PUBLIC_COPY=true VITE_APP_BASE_PATH=/ npm run build
      - run: node scripts/aws/generate-dataset-manifest.mjs public/data --output .deployment/dataset-manifest.json
      - run: |
          aws s3 sync public "s3://${{ vars.AWS_WEB_BUCKET }}" \
            --exclude '.DS_Store' --cache-control 'public,max-age=86400' --no-progress
          aws s3 sync dist "s3://${{ vars.AWS_WEB_BUCKET }}" \
            --exclude 'index.html' --cache-control 'public,max-age=31536000,immutable' --no-progress
          aws s3 cp dist/index.html "s3://${{ vars.AWS_WEB_BUCKET }}/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' --content-type 'text/html' --no-progress
          aws s3 cp .deployment/dataset-manifest.json "s3://${{ vars.AWS_WEB_BUCKET }}/manifests/runtime-${{ github.sha }}.json" \
            --cache-control 'public,max-age=31536000,immutable' --content-type 'application/json' --no-progress
      - run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/index.html' '/assets/*'
      - run: node scripts/aws/smoke-test.mjs "https://${{ vars.AWS_CLOUDFRONT_DOMAIN }}"
