# Database migrations and Edge Functions. Manual only, and gated by the
# "production" environment so a reviewer approves before anything touches the
# live database. Always run with dry_run first.
name: Supabase deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show which migrations would be applied
        type: boolean
        default: true
      deploy_functions:
        description: Also deploy Edge Functions (waitlist-notify)
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: supabase
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Migrations not yet applied
        run: supabase migration list -p "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push -p "$SUPABASE_DB_PASSWORD" ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Deploy Edge Functions
        if: inputs.deploy_functions && !inputs.dry_run
        run: supabase functions deploy waitlist-notify --no-verify-jwt --project-ref "$PROJECT_REF"
